<html>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="../config.css">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        input[type=range]::-webkit-slider-thumb {
            pointer-events: all;
            width: 24px;
            height: 24px;
            -webkit-appearance: none;
        }
    </style>
</head>

<body>
    <header>
        <a href="../index.html"> ⬅️ back </a>
    </header>

    <main>
        <div x-data="range()" class="relative max-w-sm w-full">
            <div class="flex justify-between items-center py-5">
                <label>
                    <input type="text" maxlength="5" x-on:input="mintrigger" x-model="minprice"
                        class="px-3 py-2 border border-gray-200 rounded w-24 text-center">
                </label>
                <label>
                    <input type="text" maxlength="5" x-on:input="maxtrigger" x-model="maxprice"
                        class="px-3 py-2 border border-gray-200 rounded w-24 text-center">
                </label>
            </div>

            <div>
                <input type="range" step="100" :min="min" :max="max" @input="mintrigger" x-model="minprice"
                    class="absolute pointer-events-none appearance-none z-20 h-2 w-full opacity-0 cursor-pointer" />

                <input type="range" step="100" :min="min" :max="max" @input="maxtrigger" x-model="maxprice"
                    class="absolute pointer-events-none appearance-none z-20 h-2 w-full opacity-0 cursor-pointer" />

                <div class="relative z-10 h-2">
                    <div class="absolute z-10 left-0 right-0 bottom-0 top-0 rounded-md bg-gray-200"></div>
                    <div class="absolute z-20 top-0 bottom-0 rounded-md bg-black" :style="'right:'+maxthumb+'%; left:'+minthumb+'%'"></div>
                    <div class="absolute z-30 w-6 h-6 top-0 left-0 bg-white border-2 border-black rounded-full -mt-2 -ml-1" :style="'left: '+minthumb+'%'"></div>
                    <div class="absolute z-30 w-6 h-6 top-0 right-0 bg-white border-2 border-black rounded-full -mt-2 -mr-3" :style="'right: '+maxthumb+'%'"></div>
                </div>
            </div>
        </div>
    </main>

    <script>
        function range() {
            return {
                minprice: 1000,
                maxprice: 7000,
                min: 100,
                max: 10000,
                minthumb: 0,
                maxthumb: 0,

                init() {
                    this.mintrigger();
                    this.maxtrigger();
                },

                mintrigger() {
                    this.minprice = Math.min(this.minprice, this.maxprice - 500);
                    this.minthumb = ((this.minprice - this.min) / (this.max - this.min)) * 100;
                },

                maxtrigger() {
                    this.maxprice = Math.max(this.maxprice, this.minprice + 500);
                    this.maxthumb = 100 - (((this.maxprice - this.min) / (this.max - this.min)) * 100);
                },
            }
        }
    </script>
</body>

</html>
