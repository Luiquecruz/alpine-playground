      <template x-for="filter in filters" :key="filter.attribute_code">

                            type="checkbox"
                            :value="option.value"
                            x-model="selectedOptions[filter.attribute_code]"
                            class="h-5 w-5 text-blue-600 rounded border-gray-300 focus:ring-blue-500"
                        >

                    </label>
                </template>
            </div>
        </li>
    </template>
